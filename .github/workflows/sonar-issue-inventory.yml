name: sonar-issue-inventory
on:
  push:
    branches: [fix/sonar-overall-issues-batch]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read publicly visible SonarCloud issues
        run: |
          python - <<'PY'
          import collections
          import json
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          base = "https://sonarcloud.io/api/issues/search"
          params = {"componentKeys": "StitchMl_vulcscan", "issueStatuses": "OPEN,CONFIRMED", "ps": 500, "p": 1}
          request = Request(base + "?" + urlencode(params), headers={"Accept": "application/json"})
          with urlopen(request, timeout=25) as resp:
              data = json.load(resp)
          issues = data.get("issues", [])
          print("TOTAL", data.get("paging", {}).get("total", data.get("total", 0)))
          print("RETRIEVED", len(issues))
          by_rule = collections.Counter(x.get("rule", "") for x in issues)
          by_file = collections.Counter(x.get("component", "").split(":")[-1] for x in issues)
          print("BY_RULE", json.dumps(by_rule.most_common()))
          print("BY_FILE", json.dumps(by_file.most_common(35)))
          for issue in issues:
              print("ITEM", json.dumps({
                  "rule": issue.get("rule"),
                  "component": issue.get("component", "").split(":")[-1],
                  "line": (issue.get("textRange") or {}).get("startLine", issue.get("line")),
                  "message": issue.get("message"),
                  "severity": issue.get("severity"),
                  "key": issue.get("key")
              }, ensure_ascii=False))
          PY
