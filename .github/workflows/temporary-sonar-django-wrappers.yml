name: Temporary Sonar revision audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-sonar-django-wrappers.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check exact revision quality gate and overall issues
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          def get(path, params):
              url = "https://sonarcloud.io/api/" + path + "?" + urlencode(params)
              with urlopen(Request(url, headers={"Accept":"application/json"}),timeout=25) as response:
                  return json.load(response)
          expected=os.environ["EXPECTED_SHA"]
          for _ in range(35):
              a=get("project_analyses/search",{"project":"StitchMl_vulcscan","branch":"main","ps":1}).get("analyses",[])
              latest=a[0].get("revision") if a else None
              print("SONAR_REVISION", latest, "EXPECTED", expected, flush=True)
              if latest==expected:
                  break
              time.sleep(10)
          else:
              raise SystemExit("SonarCloud did not analyze exact current main")
          gate=get("qualitygates/project_status",{"projectKey":"StitchMl_vulcscan","branch":"main"}).get("projectStatus",{}).get("status")
          data=get("issues/search",{"componentKeys":"StitchMl_vulcscan","branch":"main","issueStatuses":"OPEN,CONFIRMED","ps":100})
          count=data.get("paging",{}).get("total",data.get("total"))
          print("SONAR_GATE",gate,flush=True)
          print("SONAR_ISSUES",count,flush=True)
          print("ISSUE_DETAILS",json.dumps([{"rule":x.get("rule"),"message":x.get("message"),"component":x.get("component")} for x in data.get("issues",[])]),flush=True)
          if gate!="OK" or count!=0:
              raise SystemExit("SonarCloud regression")
          PY
