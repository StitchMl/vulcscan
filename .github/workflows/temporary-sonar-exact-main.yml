name: Temporary SonarCloud exact-main verification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-sonar-exact-main.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for SonarCloud analysis of this exact main revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          base = "https://sonarcloud.io/api/"
          def query(path, params):
              url = base + path + "?" + urlencode(params)
              with urlopen(Request(url, headers={"Accept": "application/json"}), timeout=20) as response:
                  return json.load(response)

          expected = os.environ["EXPECTED_SHA"]
          found = False
          for attempt in range(25):
              analyses = query("project_analyses/search", {
                  "project": "StitchMl_vulcscan", "branch": "main", "ps": 1
              }).get("analyses", [])
              revision = analyses[0].get("revision") if analyses else None
              print("LATEST_REVISION", revision, "EXPECTED", expected, flush=True)
              if revision == expected:
                  found = True
                  break
              time.sleep(12)
          if not found:
              raise SystemExit("SonarCloud did not analyze the exact main commit")

          gate = query("qualitygates/project_status", {
              "projectKey": "StitchMl_vulcscan", "branch": "main"
          }).get("projectStatus", {}).get("status")
          issues = query("issues/search", {
              "componentKeys": "StitchMl_vulcscan",
              "branch": "main",
              "issueStatuses": "OPEN,CONFIRMED",
              "ps": 20
          })
          count = issues.get("paging", {}).get("total", issues.get("total"))
          print("FINAL_GATE", gate, flush=True)
          print("FINAL_OPEN_ISSUES", count, flush=True)
          print("ISSUES_DETAILS", json.dumps([
              {"rule": x.get("rule"), "component": x.get("component"), "message": x.get("message")}
              for x in issues.get("issues", [])
          ]), flush=True)
          if gate != "OK" or count != 0:
              raise SystemExit("SonarCloud quality regression")
          PY
