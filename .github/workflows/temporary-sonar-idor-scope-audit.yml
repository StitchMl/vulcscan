name: Temporary read-only Sonar revision audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-sonar-idor-scope-audit.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify exact main revision and zero open issues
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          def get(path, params):
              with urlopen(Request("https://sonarcloud.io/api/" + path + "?" + urlencode(params),
                                   headers={"Accept":"application/json"}), timeout=25) as res:
                  return json.load(res)
          expected = os.environ["EXPECTED_SHA"]
          for attempt in range(36):
              results = get("project_analyses/search", {"project":"StitchMl_vulcscan","branch":"main","ps":1}).get("analyses",[])
              latest = results[0].get("revision") if results else None
              print("REVISION", latest, "EXPECTED", expected, flush=True)
              if latest == expected:
                  break
              time.sleep(10)
          else:
              raise SystemExit("Exact main Sonar analysis did not become available")
          gate = get("qualitygates/project_status", {"projectKey":"StitchMl_vulcscan","branch":"main"}).get("projectStatus",{}).get("status")
          results = get("issues/search", {"componentKeys":"StitchMl_vulcscan","branch":"main","issueStatuses":"OPEN,CONFIRMED","ps":30})
          count = results.get("paging",{}).get("total",results.get("total"))
          print("QUALITY_GATE",gate,flush=True)
          print("OPEN_ISSUES",count,flush=True)
          print("DETAILS",json.dumps([{"rule":x.get("rule"),"message":x.get("message")} for x in results.get("issues",[])]),flush=True)
          if gate != "OK" or count != 0:
              raise SystemExit("Sonar regression: gate or issue count")
          PY
