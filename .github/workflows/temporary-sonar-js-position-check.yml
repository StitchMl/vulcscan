name: Temporary exact SonarCloud main check
# Re-run after complexity refactor
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-sonar-js-position-check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Ensure exact revision passed with zero open issues
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          def get(path, params):
              url = "https://sonarcloud.io/api/" + path + "?" + urlencode(params)
              with urlopen(Request(url, headers={"Accept": "application/json"}), timeout=25) as response:
                  return json.load(response)

          expected = os.environ["EXPECTED_SHA"]
          for attempt in range(40):
              analyses = get("project_analyses/search", {"project":"StitchMl_vulcscan", "branch":"main", "ps":1}).get("analyses", [])
              latest = analyses[0].get("revision") if analyses else None
              print("SONAR_ANALYZED_SHA", latest, "EXPECTED", expected, flush=True)
              if latest == expected:
                  break
              time.sleep(10)
          else:
              raise SystemExit("SonarCloud has not analyzed the exact revision")
          gate = get("qualitygates/project_status", {"projectKey":"StitchMl_vulcscan", "branch":"main"}).get("projectStatus", {}).get("status")
          issues = get("issues/search", {"componentKeys":"StitchMl_vulcscan", "branch":"main", "issueStatuses":"OPEN,CONFIRMED", "ps":100})
          count = issues.get("paging", {}).get("total", issues.get("total"))
          print("SONAR_QUALITY_GATE", gate, flush=True)
          print("SONAR_OPEN_ISSUES", count, flush=True)
          print("SONAR_DETAILS", json.dumps([{"rule":i.get("rule"), "component":i.get("component"), "message":i.get("message")} for i in issues.get("issues", [])]), flush=True)
          if gate != "OK" or count != 0:
              raise SystemExit("SonarCloud regression")
          PY
