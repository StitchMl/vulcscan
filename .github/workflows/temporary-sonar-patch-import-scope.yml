name: Temporary SonarCloud exact-main patch safety audit
# Revalidate scoped imports and review-only shell commands
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-sonar-patch-import-scope.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check exact Sonar analysis and overall OPEN issues
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          def get(endpoint, params):
              url = "https://sonarcloud.io/api/" + endpoint + "?" + urlencode(params)
              with urlopen(Request(url, headers={"Accept": "application/json"}), timeout=25) as response:
                  return json.load(response)
          expected = os.environ["EXPECTED_REVISION"]
          for _ in range(35):
              analyses = get("project_analyses/search", {"project": "StitchMl_vulcscan", "branch": "main", "ps": 1}).get("analyses", [])
              latest = analyses[0].get("revision") if analyses else None
              print("LATEST_REVISION", latest, "EXPECTED", expected, flush=True)
              if latest == expected:
                  break
              time.sleep(10)
          else:
              raise SystemExit("SonarCloud has not analyzed exact main revision")
          gate = get("qualitygates/project_status", {"projectKey": "StitchMl_vulcscan", "branch": "main"}).get("projectStatus", {}).get("status")
          data = get("issues/search", {"componentKeys": "StitchMl_vulcscan", "branch": "main", "issueStatuses": "OPEN,CONFIRMED", "ps": 100})
          count = data.get("paging", {}).get("total", data.get("total"))
          print("QUALITY_GATE", gate, flush=True)
          print("OPEN_ISSUES", count, flush=True)
          print("ISSUE_DETAILS", json.dumps([{"rule": i.get("rule"), "component": i.get("component"), "message": i.get("message")} for i in data.get("issues", [])]), flush=True)
          if gate != "OK" or count != 0:
              raise SystemExit("SonarCloud regression")
          PY
