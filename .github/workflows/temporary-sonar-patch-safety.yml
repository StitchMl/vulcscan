name: Temporary exact main Sonar patch-safety audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-sonar-patch-safety.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Confirm exact main revision has green gate and zero open issues
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          def get(path, params):
              url = "https://sonarcloud.io/api/" + path + "?" + urlencode(params)
              with urlopen(Request(url, headers={"Accept": "application/json"}), timeout=25) as response:
                  return json.load(response)

          expected = os.environ["EXPECTED_SHA"]
          for _ in range(35):
              analyses = get("project_analyses/search", {"project": "StitchMl_vulcscan", "branch": "main", "ps": 1}).get("analyses", [])
              latest = analyses[0].get("revision") if analyses else None
              print("SONAR_SHA", latest, "EXPECTED", expected, flush=True)
              if latest == expected:
                  break
              time.sleep(10)
          else:
              raise SystemExit("SonarCloud exact revision unavailable")
          gate = get("qualitygates/project_status", {"projectKey": "StitchMl_vulcscan", "branch": "main"}).get("projectStatus", {}).get("status")
          data = get("issues/search", {"componentKeys": "StitchMl_vulcscan", "branch": "main", "issueStatuses": "OPEN,CONFIRMED", "ps": 50})
          count = data.get("paging", {}).get("total", data.get("total"))
          print("SONAR_GATE", gate, flush=True)
          print("SONAR_ISSUES", count, flush=True)
          print("SONAR_DETAILS", json.dumps([{"rule":x.get("rule"),"component":x.get("component"),"message":x.get("message")} for x in data.get("issues",[])]), flush=True)
          if gate != "OK" or count != 0:
              raise SystemExit("SonarCloud regression")
          PY
