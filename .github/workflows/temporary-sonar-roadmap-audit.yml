name: Temporary exact-main SonarCloud roadmap audit
# Recheck after S9073 and S3776 corrections
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-sonar-roadmap-audit.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Confirm exact main Sonar revision and overall zero issues
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          def get(endpoint, params):
              url = "https://sonarcloud.io/api/" + endpoint + "?" + urlencode(params)
              with urlopen(Request(url, headers={"Accept": "application/json"}), timeout=25) as response:
                  return json.load(response)

          expected = os.environ["EXPECTED_SHA"]
          for attempt in range(32):
              analyses = get("project_analyses/search", {
                  "project": "StitchMl_vulcscan", "branch": "main", "ps": 1
              }).get("analyses", [])
              revision = analyses[0].get("revision") if analyses else None
              print("ANALYZED_REVISION", revision, "EXPECTED", expected, flush=True)
              if revision == expected:
                  break
              time.sleep(10)
          else:
              raise SystemExit("The exact main commit has not been analyzed")
          status = get("qualitygates/project_status", {
              "projectKey": "StitchMl_vulcscan", "branch": "main"
          }).get("projectStatus", {}).get("status")
          data = get("issues/search", {
              "componentKeys": "StitchMl_vulcscan",
              "branch": "main",
              "issueStatuses": "OPEN,CONFIRMED",
              "ps": 50
          })
          count = data.get("paging", {}).get("total", data.get("total"))
          print("FINAL_GATE", status, flush=True)
          print("FINAL_OPEN_ISSUES", count, flush=True)
          print("DETAILS", json.dumps([
              {"rule": x.get("rule"), "component": x.get("component"), "message": x.get("message")}
              for x in data.get("issues", [])
          ]), flush=True)
          if status != "OK" or count != 0:
              raise SystemExit("SonarCloud quality gate or issue count has regressed")
          PY
