name: Temporary verify exact main Sonar status
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-sonar-roadmap-check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify SonarCloud quality gate and overall-code issues
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          def get(path, params):
              url = "https://sonarcloud.io/api/" + path + "?" + urlencode(params)
              with urlopen(Request(url, headers={"Accept": "application/json"}), timeout=20) as r:
                  return json.load(r)
          expected = os.environ["EXPECTED_SHA"]
          for attempt in range(30):
              analyses = get("project_analyses/search", {"project": "StitchMl_vulcscan", "branch": "main", "ps": 1}).get("analyses", [])
              revision = analyses[0].get("revision") if analyses else None
              print("SONAR_REVISION", revision, "EXPECTED", expected, flush=True)
              if revision == expected:
                  break
              time.sleep(10)
          else:
              raise SystemExit("Missing exact Sonar analysis for main")
          gate = get("qualitygates/project_status", {"projectKey": "StitchMl_vulcscan", "branch": "main"}).get("projectStatus", {}).get("status")
          data = get("issues/search", {"componentKeys": "StitchMl_vulcscan", "branch": "main", "issueStatuses": "OPEN,CONFIRMED", "ps": 25})
          issues = data.get("paging", {}).get("total", data.get("total"))
          print("SONAR_GATE", gate, flush=True)
          print("SONAR_OPEN_ISSUES", issues, flush=True)
          print("SONAR_ISSUE_DETAILS", json.dumps([{"rule": x.get("rule"), "component": x.get("component"), "message": x.get("message")} for x in data.get("issues", [])]), flush=True)
          if gate != "OK" or issues != 0:
              raise SystemExit("SonarCloud regression")
          PY
