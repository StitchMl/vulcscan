name: Temporary exact-main SonarCloud roadmap audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-sonar-roadmap-extended.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify quality gate and overall open issues for exact commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          def query(endpoint, params):
              url = "https://sonarcloud.io/api/" + endpoint + "?" + urlencode(params)
              with urlopen(Request(url, headers={"Accept": "application/json"}), timeout=25) as response:
                  return json.load(response)

          expected = os.environ["EXPECTED_SHA"]
          for attempt in range(35):
              analyses = query("project_analyses/search", {
                  "project": "StitchMl_vulcscan", "branch": "main", "ps": 1
              }).get("analyses", [])
              latest = analyses[0].get("revision") if analyses else None
              print("SONAR_REVISION", latest, "EXPECTED", expected, flush=True)
              if latest == expected:
                  break
              time.sleep(10)
          else:
              raise SystemExit("SonarCloud has not analyzed current main")
          gate = query("qualitygates/project_status", {
              "projectKey": "StitchMl_vulcscan", "branch": "main"
          }).get("projectStatus", {}).get("status")
          data = query("issues/search", {
              "componentKeys": "StitchMl_vulcscan",
              "branch": "main",
              "issueStatuses": "OPEN,CONFIRMED",
              "ps": 50
          })
          count = data.get("paging", {}).get("total", data.get("total"))
          print("SONAR_GATE", gate, flush=True)
          print("SONAR_OPEN_ISSUES", count, flush=True)
          print("SONAR_ISSUES_DETAIL", json.dumps([
              {"rule": issue.get("rule"), "component": issue.get("component"),
               "line": issue.get("line"), "message": issue.get("message")}
              for issue in data.get("issues", [])
          ]), flush=True)
          if gate != "OK" or count != 0:
              raise SystemExit("Unexpected SonarCloud quality regression")
          PY
