name: Temporary exact-revision SonarCloud verification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-sonar-roadmap-final.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify current main quality gate and all open issues
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          def call(endpoint, params):
              request = Request("https://sonarcloud.io/api/" + endpoint + "?" + urlencode(params), headers={"Accept": "application/json"})
              with urlopen(request, timeout=20) as response:
                  return json.load(response)
          expected = os.environ["EXPECTED_SHA"]
          for _ in range(30):
              result = call("project_analyses/search", {"project":"StitchMl_vulcscan","branch":"main","ps":1})
              latest = result.get("analyses", [{}])[0].get("revision")
              print("ANALYZED_REVISION", latest, "EXPECTED", expected, flush=True)
              if latest == expected:
                  break
              time.sleep(10)
          else:
              raise SystemExit("Sonar revision did not become current")
          status = call("qualitygates/project_status", {"projectKey":"StitchMl_vulcscan","branch":"main"}).get("projectStatus",{}).get("status")
          data = call("issues/search", {"componentKeys":"StitchMl_vulcscan","branch":"main","issueStatuses":"OPEN,CONFIRMED","ps":100})
          count = data.get("paging",{}).get("total",data.get("total"))
          print("SONAR_GATE", status, flush=True)
          print("SONAR_ISSUES", count, flush=True)
          print("SONAR_DETAILS", json.dumps([{"rule":x.get("rule"),"component":x.get("component"),"message":x.get("message")} for x in data.get("issues",[])]), flush=True)
          if status != "OK" or count != 0:
              raise SystemExit("Quality Gate not OK or issues not zero")
          PY
