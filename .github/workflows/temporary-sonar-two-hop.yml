name: Temporary SonarCloud exact-main check
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-sonar-two-hop.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ensure SonarCloud has analyzed the exact head and issue count is zero
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          def get(endpoint, query):
              url = "https://sonarcloud.io/api/" + endpoint + "?" + urlencode(query)
              with urlopen(Request(url, headers={"Accept": "application/json"}), timeout=20) as reply:
                  return json.load(reply)
          expected = os.environ["EXPECTED_REVISION"]
          for attempt in range(30):
              recent = get("project_analyses/search", {"project":"StitchMl_vulcscan","branch":"main","ps":1}).get("analyses",[])
              head = recent[0].get("revision") if recent else None
              print("SONAR_REVISION", head, "EXPECTED", expected, flush=True)
              if head == expected:
                  break
              time.sleep(10)
          else:
              raise SystemExit("SonarCloud did not finish the exact main revision")
          gate = get("qualitygates/project_status", {"projectKey":"StitchMl_vulcscan","branch":"main"}).get("projectStatus",{}).get("status")
          data = get("issues/search", {"componentKeys":"StitchMl_vulcscan","branch":"main","issueStatuses":"OPEN,CONFIRMED","ps":25})
          issues = data.get("paging",{}).get("total",data.get("total"))
          print("SONAR_GATE",gate,flush=True)
          print("SONAR_OPEN_ISSUES",issues,flush=True)
          print("SONAR_ISSUE_DETAILS",json.dumps([{"rule":x.get("rule"),"component":x.get("component"),"message":x.get("message")} for x in data.get("issues",[])]),flush=True)
          if gate != "OK" or issues != 0:
              raise SystemExit("SonarCloud quality gate or issue-count regression")
          PY
